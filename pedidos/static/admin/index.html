<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pedidos Tacos El Compa</title>
<style>
:root {
  --crema: #FBF2E6;
  --rojo: #A40902;
  --oro: #FCB416;
  --texto: #1f2937;
  --muted: #6b7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--crema);
  color: var(--texto);
}
header {
  background: var(--rojo); color: white; padding: 1rem; text-align: center;
  position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 1.2rem; }
.container { max-width: 900px; margin: 0 auto; padding: 1rem; }

.login-box {
  max-width: 320px; margin: 4rem auto; background: white; padding: 2rem;
  border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,.1);
  text-align: center;
}
.login-box h2 { color: var(--rojo); margin-bottom: 1rem; }
.login-box input {
  width: 100%; padding: .7rem; border: 1px solid #ddd; border-radius: 8px;
  font-size: 1rem; margin-bottom: 1rem;
}
.login-box button {
  width: 100%; padding: .7rem; background: var(--rojo); color: white;
  border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
}

.order-card {
  background: white; border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  border-left: 4px solid #ccc;
}
.order-card.pending_payment { border-left-color: #f59e0b; }
.order-card.confirmed { border-left-color: #22c55e; }
.order-card.preparing { border-left-color: #3b82f6; }
.order-card.ready { border-left-color: #8b5cf6; }
.order-card.delivered { border-left-color: #6b7280; }
.order-card.cancelled { border-left-color: #ef4444; opacity: .6; }

.status-badge {
  display: inline-block; font-size: .75rem; font-weight: 600; padding: .2rem .6rem;
  border-radius: 20px; background: #f3f4f6; color: var(--muted);
}
.status-pending_payment { background: #fef3c7; color: #92400e; }
.status-confirmed { background: #dcfce7; color: #166534; }
.status-preparing { background: #dbeafe; color: #1e40af; }
.status-ready { background: #f3e8ff; color: #6b21a8; }
.status-delivered { background: #e5e7eb; color: #374151; }
.status-cancelled { background: #fee2e2; color: #991b1b; }

.order-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem;
}
.order-header .num { font-weight: 700; font-size: 1.1rem; }
.order-header .time { font-size: .8rem; color: var(--muted); }

.order-body { margin-bottom: .5rem; font-size: .9rem; }
.order-body .label { font-weight: 600; color: var(--muted); }

.order-items { 
  background: #f9fafb; border-radius: 6px; padding: .5rem .7rem; margin: .5rem 0;
  font-size: .85rem;
}
.order-items .item { display: flex; justify-content: space-between; padding: .15rem 0; }

.order-total {
  display: flex; justify-content: space-between; font-weight: 700;
  border-top: 1px solid #e5e7eb; padding-top: .5rem; margin-top: .5rem;
}

.yappy-proof { margin: .5rem 0; }
.yappy-proof img { max-width: 200px; max-height: 200px; border-radius: 8px; cursor: pointer; }

.order-actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
.order-actions button {
  padding: .4rem .8rem; border: 1px solid #ddd; border-radius: 6px;
  font-size: .8rem; cursor: pointer; background: white; transition: .15s;
  font-weight: 600;
}
.order-actions button:hover { background: #f3f4f6; }
.order-actions .btn-yappy {
  background: #fef3c7; border-color: #f59e0b; color: #92400e;
}
.order-actions .btn-yappy:hover { background: #fde68a; }
.order-actions .btn-prepare { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }
.order-actions .btn-ready { background: #f3e8ff; border-color: #8b5cf6; color: #6b21a8; }
.order-actions .btn-deliver { background: #e5e7eb; border-color: #6b7280; }
.order-actions .btn-cancel { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

@media (max-width:600px) {
  .order-header { flex-direction: column; align-items: flex-start; gap: .3rem; }
}
</style>
</head>
<body>

<header>
  <h1>📋 Admin — Pedidos Tacos El Compa</h1>
</header>

<div class="container" id="app">
  <div id="loginView">
    <div class="login-box">
      <h2>🔐 Admin</h2>
      <input type="password" id="passInput" placeholder="Contraseña de admin" onkeydown="if(event.key==='Enter')login()">
      <button onclick="login()">Entrar</button>
    </div>
  </div>
  <div id="ordersView" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h2 style="color:var(--rojo);">Pedidos</h2>
      <button onclick="location.reload()" style="padding:.4rem .8rem;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;">🔄 Actualizar</button>
    </div>
    <div id="ordersList">
      <p style="color:var(--muted);text-align:center;padding:2rem;">Cargando pedidos…</p>
    </div>
  </div>
</div>

<div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;padding:2rem;cursor:pointer;" onclick="this.style.display='none'">
  <img id="imgModalContent" style="max-width:100%;max-height:100%;display:block;margin:auto;">
</div>

<script>
let apiBase = '';
let pass = '';

function login() {
  pass = document.getElementById('passInput').value.trim();
  if (!pass) return;
  loadOrders();
}

async function loadOrders() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('ordersView').style.display = 'block';
  document.getElementById('ordersList').innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem;">Cargando pedidos…</p>';

  try {
    const r = await fetch(`${apiBase}/api/orders?pass=${encodeURIComponent(pass)}`);
    const data = await r.json();
    if (!data.ok) {
      document.getElementById('ordersView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      alert('Contraseña incorrecta');
      return;
    }
    renderOrders(data.orders);
  } catch (e) {
    document.getElementById('ordersList').innerHTML = `<p style="color:var(--rojo);">Error: ${e.message}</p>`;
  }
}

function renderOrders(orders) {
  if (orders.length === 0) {
    document.getElementById('ordersList').innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem;">No hay pedidos aún 🎉</p>';
    return;
  }

  let html = '';
  for (const o of orders) {
    const statusIcons = { pending_payment: '⏳', confirmed: '✅', preparing: '👨‍🍳', ready: '📦', delivered: '🏁', cancelled: '❌' };
    const statusLabels = { pending_payment: 'Pendiente de pago', confirmed: 'Pagado (Yappy OK)', preparing: 'En preparación', ready: 'Listo', delivered: 'Entregado', cancelled: 'Cancelado' };
    const icon = statusIcons[o.status] || '❓';

    html += `
      <div class="order-card ${o.status}" id="order-${o.id}">
        <div class="order-header">
          <div class="num">${icon} Pedido #${o.id}</div>
          <span class="status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span>
        </div>
        <div class="order-body">
          <div><span class="label">Cliente:</span> ${escHtml(o.customer_name)}</div>
          <div><span class="label">Teléfono:</span> ${escHtml(o.phone)}</div>
          <div><span class="label">Dirección:</span> ${escHtml(o.address)}</div>
          ${o.delivery_notes ? `<div><span class="label">Notas:</span> ${escHtml(o.delivery_notes)}</div>` : ''}
          <div><span class="label">📅</span> ${o.created_at}</div>
        </div>

        <div class="order-items" id="items-${o.id}">
          <small style="color:var(--muted);">Cargando productos…</small>
        </div>

        ${o.yappy_proof ? `<div class="yappy-proof"><img src="data:image/jpeg;base64,${o.yappy_proof}" alt="Comprobante Yappy" onclick="openImg('data:image/jpeg;base64,${o.yappy_proof}')"></div>` : ''}

        <div class="order-total">
          <span>Subtotal: $${(o.total - o.delivery_cost).toFixed(2)}${o.delivery_cost > 0 ? ` + Envío: $${o.delivery_cost.toFixed(2)}` : ''}</span>
          <span>Total: $${o.total.toFixed(2)}</span>
        </div>

        <div class="order-actions">
          ${renderActions(o)}
        </div>
      </div>`;

    html += `<script>
      (async function() {
        try {
          const r = await fetch(apiBase + '/api/products');
          const data = await r.json();
          const products = data.products || [];
          const r2 = await fetch(\`\${apiBase}/api/orders?id=\${${o.id}}&pass=\${encodeURIComponent(pass)}\`);
          const data2 = await r2.json();
          if (data2.ok && data2.items) {
            let itemsHtml = '';
            for (const item of data2.items) {
              itemsHtml += \`<div class="item"><span>\${item.quantity}× \${escHtml(item.product_name)}</span><span>$\${item.subtotal.toFixed(2)}</span></div>\`;
            }
            document.getElementById('items-${o.id}').innerHTML = itemsHtml;
          }
        } catch(e) {}
      })();
    <\/script>`;
  }

  document.getElementById('ordersList').innerHTML = html;
}

function renderActions(o) {
  const id = o.id;
  let actions = '';
  if (o.status === 'pending_payment') {
    actions += `<button class="btn-yappy" onclick="changeStatus(${id},'confirmed')">✅ Confirmar Yappy</button>`;
    actions += `<button class="btn-cancel" onclick="changeStatus(${id},'cancelled')">❌ Cancelar</button>`;
  } else if (o.status === 'confirmed') {
    actions += `<button class="btn-prepare" onclick="changeStatus(${id},'preparing')">👨‍🍳 En preparación</button>`;
  } else if (o.status === 'preparing') {
    actions += `<button class="btn-ready" onclick="changeStatus(${id},'ready')">📦 Listo</button>`;
  } else if (o.status === 'ready') {
    actions += `<button class="btn-deliver" onclick="changeStatus(${id},'delivered')">🏁 Entregado</button>`;
  }
  return actions;
}

async function changeStatus(id, status) {
  if (!confirm('¿Cambiar estado a ' + status + '?')) return;
  try {
    const r = await fetch(`${apiBase}/api/orders?id=${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, pass }),
    });
    const data = await r.json();
    if (data.ok) {
      loadOrders();
    } else {
      alert('Error: ' + (data.error || 'desconocido'));
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function openImg(src) {
  document.getElementById('imgModalContent').src = src;
  document.getElementById('imgModal').style.display = 'block';
}
</script>
</body>
</html>
